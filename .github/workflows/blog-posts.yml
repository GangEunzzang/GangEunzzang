name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://gangeunzzang.github.io/feed.xml"
          max_post_count: 5
          template: "$newline- `$date`&nbsp; [$title]($url)"
          date_format: "yyyy.mm"
          commit_message: "Update latest blog posts"
